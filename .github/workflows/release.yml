# Release 构建工作流（v0.2.8 引入）
#
# 触发：推送 v* 标签（发布）或手动 workflow_dispatch（试构建，不发 release；
#       若 dispatch 时填写 tag input，则产物上传到该 tag 对应的既有 release，
#       用于给已发布版本补产物）。
# 产物：macOS dmg + zip（arm64 / x64 矩阵）+ Windows NSIS exe（x64），
#       附加 latest-mac.yml / latest.yml（electron-updater 的 generic provider
#       指向 releases/latest/download/，因此 yml 必须与安装包同名上传到同一 release）。
#
# 签名：CI 没有 Developer ID 证书，走 DESKTOP_MAC_SIGNING=adhoc（electron-builder
#       identity: "-"）。下载安装后需 `xattr -dr com.apple.quarantine` 解除隔离。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（仅试构建时用作产物名后缀，不创建 release）"
        required: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 依赖缓存提速（2026-09-04）：v0.3.27 win 构建 npm ci 花了 12 分钟
      # （上次同 key 仅 30s）——免费共享 runner 磁盘 IO 波动，458+ 包全量
      # 解压是瓶颈，npm 下载缓存（~/.npm）命中也无济于事。改为缓存
      # node_modules 本体：命中即跳过 npm ci，彻底绕开解压 IO；同时缓存
      # Electron / electron-builder 二进制下载（build 步骤省 ~100MB 拉取）。
      # key 绑定双 lock hash，依赖变更自动失效重建；mac 双架构分 key
      # （原生模块 prebuilt 架构不同）。
      - name: Cache dependencies (node_modules + electron)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}

      # 依赖装两份：根目录（前端 + electron + 打包）和 server/（业务）。
      # 缓存命中时跳过（node_modules 已就位）；--no-audit/--no-fund 砍掉
      # registry 元数据往返，miss 时也更快。
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund

      # 复用本地同一打包脚本：build:all → electron:build → 原生模块按
      # Electron ABI 重建 → electron-builder（dmg + zip）
      - name: Build desktop app (macOS ${{ matrix.arch }})
        run: node scripts/build-desktop-target.cjs --platform darwin --arch ${{ matrix.arch }}
        env:
          DESKTOP_MAC_SIGNING: adhoc
          # CI 无证书，禁止 electron-builder 探测钥匙串
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 注意：不上传 workflow artifacts——该账户 Actions artifact 存储配额
      # 已满会阻塞 job；release assets 走独立存储，不受影响。
      # 发布口径（mac/win 一致）：tag push 发布；dispatch 填了 tag 则补传到该
      # 既有 release；都不满足则仅试构建。上传策略是「存在即跳过 + 并发兜底」：
      # 矩阵 job / 补传场景下 --clobber 的先删后传存在竞态窗口（实测 2026-08-24
      # dispatch 补传时 latest-mac.yml 撞 422，且删除后未传回导致资产丢失），
      # 跳过语义天然消除竞态，且不会重复上传/覆盖已发布资产。
      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          DIR="dist-desktop/darwin-${{ matrix.arch }}"
          # 第一个到达的 job 创建 release，后续 job 复用。
          # 2026-09-04 修复：--generate-notes 在单 commit 无 PR 时只生成一行
          # Full Changelog 链接，变更说明完全缺失（v0.3.27 实测）。改为从
          # CHANGELOG.md 提取当前 tag 段落作 notes；无段落时回退自动生成。
          NOTES_FILE="$(mktemp)"
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 { sec=1; next }
            sec && /^## \[/ { exit }
            sec { print }
          ' CHANGELOG.md | sed '/^---$/d' > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" \
                --title "Feishu Sync ${TAG}" \
                --notes-file "$NOTES_FILE" \
                --draft=false
          else
            echo "::warning::CHANGELOG.md 无 ${TAG} 段落，回退自动生成 notes"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" \
                --title "Feishu Sync ${TAG}" \
                --generate-notes \
                --draft=false
          fi

          upload_asset() {
            local f="$1" base
            base="$(basename "$f")"
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                | grep -qx "$base"; then
              echo "::notice::skip existing asset: $base"
              return 0
            fi
            if ! gh release upload "$TAG" "$f"; then
              # 并发兜底：另一矩阵 job 恰好抢先上传了同名资产（如 latest-mac.yml）
              # ——资产已存在即视为成功，不再 clobber。
              if gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -qx "$base"; then
                echo "::notice::asset uploaded concurrently, treat as ok: $base"
                return 0
              fi
              return 1
            fi
          }

          # 2026-09 修复：mac 双架构的更新馈送分离。arm64 构建的 channel 为
          # latest-arm64，产出 latest-arm64-mac.yml；x64 保持 latest-mac.yml。
          # 此前两个架构各自生成同名 latest-mac.yml 竞速上传，输者条目丢失，
          # 导致自动更新可能拿到错误架构的安装包。glob 改为 latest*.yml。
          for f in "$DIR"/*.dmg "$DIR"/*.zip "$DIR"/latest*.yml; do
            [ -e "$f" ] || continue
            upload_asset "$f"
          done

  build-win:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 依赖缓存提速（2026-09-04）：同 mac job，win 是重灾区（npm ci 12m）。
      # Windows 下 electron / electron-builder 缓存目录在 %LOCALAPPDATA%，
      # ~ 展开由 actions/cache 处理。
      - name: Cache dependencies (node_modules + electron)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: deps-${{ runner.os }}-x64-${{ hashFiles('package-lock.json', 'server/package-lock.json') }}

      # 依赖装两份：根目录（前端 + electron + 打包）和 server/（业务）。
      # 缓存命中时跳过；--no-audit/--no-fund 砍 registry 往返。
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund

      # 复用本地同一打包脚本：build:all → electron:build → 原生模块按
      # Electron ABI 重建 → electron-builder（NSIS oneClick=false）
      - name: Build desktop app (Windows x64)
        shell: bash
        run: node scripts/build-desktop-target.cjs --platform win32 --arch x64

      # 与 mac job 同一发布口径：tag push 发布、dispatch 补传、仅试构建不上传。
      # Windows 产物 = NSIS exe + latest.yml（+ blockmap，NSIS 差分更新启用时
      # 生成）。同样用「存在即跳过 + 并发兜底」，不用 --clobber。
      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          DIR="dist-desktop/win32-x64"
          # 与 mac job 同源：CHANGELOG.md 提取 tag 段落作 notes（2026-09-04
          # 修复变更说明缺失，详见 mac job 注释）；无段落回退自动生成。
          NOTES_FILE="$(mktemp)"
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 { sec=1; next }
            sec && /^## \[/ { exit }
            sec { print }
          ' CHANGELOG.md | sed '/^---$/d' > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" \
                --title "Feishu Sync ${TAG}" \
                --notes-file "$NOTES_FILE" \
                --draft=false
          else
            echo "::warning::CHANGELOG.md 无 ${TAG} 段落，回退自动生成 notes"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" \
                --title "Feishu Sync ${TAG}" \
                --generate-notes \
                --draft=false
          fi

          upload_asset() {
            local f="$1" base
            base="$(basename "$f")"
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                | grep -qx "$base"; then
              echo "::notice::skip existing asset: $base"
              return 0
            fi
            if ! gh release upload "$TAG" "$f"; then
              if gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -qx "$base"; then
                echo "::notice::asset uploaded concurrently, treat as ok: $base"
                return 0
              fi
              return 1
            fi
          }

          shopt -s nullglob
          for f in "$DIR"/*.exe "$DIR"/latest.yml "$DIR"/*.blockmap; do
            upload_asset "$f"
          done
