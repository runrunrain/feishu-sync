# Release 构建工作流（v0.2.8 引入）
#
# 触发：推送 v* 标签（发布）或手动 workflow_dispatch（试构建，不发 release；
#       若 dispatch 时填写 tag input，则产物上传到该 tag 对应的既有 release，
#       用于给已发布版本补产物）。
# 产物：macOS dmg + zip（arm64 / x64 矩阵）+ Windows NSIS exe（x64），
#       附加 latest-mac.yml / latest.yml（electron-updater 的 generic provider
#       指向 releases/latest/download/，因此 yml 必须与安装包同名上传到同一 release）。
#
# 签名：CI 没有 Developer ID 证书，走 DESKTOP_MAC_SIGNING=adhoc（electron-builder
#       identity: "-"）。下载安装后需 `xattr -dr com.apple.quarantine` 解除隔离。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（仅试构建时用作产物名后缀，不创建 release）"
        required: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # 依赖装两份：根目录（前端 + electron + 打包）和 server/（业务）
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      # 复用本地同一打包脚本：build:all → electron:build → 原生模块按
      # Electron ABI 重建 → electron-builder（dmg + zip）
      - name: Build desktop app (macOS ${{ matrix.arch }})
        run: node scripts/build-desktop-target.cjs --platform darwin --arch ${{ matrix.arch }}
        env:
          DESKTOP_MAC_SIGNING: adhoc
          # CI 无证书，禁止 electron-builder 探测钥匙串
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 注意：不上传 workflow artifacts——该账户 Actions artifact 存储配额
      # 已满会阻塞 job；release assets 走独立存储，不受影响。
      # 发布口径（mac/win 一致）：tag push 发布；dispatch 填了 tag 则补传到该
      # 既有 release；都不满足则仅试构建。上传策略是「存在即跳过 + 并发兜底」：
      # 矩阵 job / 补传场景下 --clobber 的先删后传存在竞态窗口（实测 2026-08-24
      # dispatch 补传时 latest-mac.yml 撞 422，且删除后未传回导致资产丢失），
      # 跳过语义天然消除竞态，且不会重复上传/覆盖已发布资产。
      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          DIR="dist-desktop/darwin-${{ matrix.arch }}"
          # 第一个到达的 job 创建 release，后续 job 复用。
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Feishu Sync ${TAG}" \
              --generate-notes \
              --draft=false

          upload_asset() {
            local f="$1" base
            base="$(basename "$f")"
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                | grep -qx "$base"; then
              echo "::notice::skip existing asset: $base"
              return 0
            fi
            if ! gh release upload "$TAG" "$f"; then
              # 并发兜底：另一矩阵 job 恰好抢先上传了同名资产（如 latest-mac.yml）
              # ——资产已存在即视为成功，不再 clobber。
              if gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -qx "$base"; then
                echo "::notice::asset uploaded concurrently, treat as ok: $base"
                return 0
              fi
              return 1
            fi
          }

          for f in "$DIR"/*.dmg "$DIR"/*.zip "$DIR"/latest-mac.yml; do
            [ -e "$f" ] || continue
            upload_asset "$f"
          done

  build-win:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # 依赖装两份：根目录（前端 + electron + 打包）和 server/（业务）
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix server

      # 复用本地同一打包脚本：build:all → electron:build → 原生模块按
      # Electron ABI 重建 → electron-builder（NSIS oneClick=false）
      - name: Build desktop app (Windows x64)
        shell: bash
        run: node scripts/build-desktop-target.cjs --platform win32 --arch x64

      # 与 mac job 同一发布口径：tag push 发布、dispatch 补传、仅试构建不上传。
      # Windows 产物 = NSIS exe + latest.yml（+ blockmap，NSIS 差分更新启用时
      # 生成）。同样用「存在即跳过 + 并发兜底」，不用 --clobber。
      - name: Publish to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          DIR="dist-desktop/win32-x64"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Feishu Sync ${TAG}" \
              --generate-notes \
              --draft=false

          upload_asset() {
            local f="$1" base
            base="$(basename "$f")"
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                | grep -qx "$base"; then
              echo "::notice::skip existing asset: $base"
              return 0
            fi
            if ! gh release upload "$TAG" "$f"; then
              if gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -qx "$base"; then
                echo "::notice::asset uploaded concurrently, treat as ok: $base"
                return 0
              fi
              return 1
            fi
          }

          shopt -s nullglob
          for f in "$DIR"/*.exe "$DIR"/latest.yml "$DIR"/*.blockmap; do
            upload_asset "$f"
          done
